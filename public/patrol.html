<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7e6cc;--dim:#cdb6c8;--deep:#1b1530;--plum:#3a2a52;--gold:#f8c060;--ember:#f08a3a}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ov{pointer-events:none}
body.flying,body.flying canvas{cursor:none}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .6s steps(6);z-index:5}
#title.gone{opacity:0;pointer-events:none}
#card{background:rgba(27,21,48,.82);padding:34px 40px 28px;max-width:min(520px,86vw);text-align:center;color:var(--ink);
  box-shadow:0 0 0 4px #2a1f44,0 0 0 8px #f0b060,0 0 0 12px #2a1f44,12px 12px 0 12px rgba(10,6,20,.55)}
#card h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(34px,8vw,64px);margin:4px 0 14px;letter-spacing:4px;color:#ffd890;
  text-shadow:4px 4px 0 #b8343a,8px 8px 0 #3a2a52}
#card .tag{font-size:12px;color:var(--dim);letter-spacing:1px;margin:0 0 22px}
#bar{height:14px;background:#2a1f44;box-shadow:0 0 0 2px #6a5a8a;margin:0 auto 10px;width:100%;position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#f8c060 0 6px,#f08a3a 6px 8px)}
#status{font-size:11px;color:var(--dim);min-height:14px;margin:0 0 18px}
#go{font-family:'Press Start 2P',monospace;font-size:14px;color:#1b1530;background:#ffd890;border:0;padding:14px 20px;cursor:pointer;
  box-shadow:0 0 0 3px #1b1530,0 0 0 6px #ffd890,6px 6px 0 6px #b8343a;visibility:hidden}
#go.ready{visibility:visible;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{background:#fff0c8}}
#card .keys{margin:22px 0 0;font-size:11px;line-height:1.9;color:#bfaed0}
#card .keys b{color:var(--ink);font-weight:700}
#hints{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:4;padding:5px 12px;background:rgba(22,16,38,.62);color:#e9d8c6;
  font-size:11px;letter-spacing:.3px;white-space:nowrap;display:none;gap:14px;align-items:center;max-width:96vw;overflow:hidden}
#hints span{opacity:.82}
#hints b{color:#ffd890;font-weight:700}
#msl{letter-spacing:2px;color:#ffd890}
#msl i{font-style:normal;color:#5a4a6a}
#view{color:#9ef08a}
#snd{position:fixed;right:10px;top:10px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:11px;color:#e9d8c6;background:rgba(22,16,38,.62);
  border:0;padding:6px 10px;cursor:pointer;box-shadow:0 0 0 2px #4a3a6a}
#snd.on{color:#1b1530;background:#ffd890}
#touch{display:none}
body.touch #touch{display:block}
body.touch #hints .mouse{display:none}
.tb{position:fixed;z-index:6;width:68px;height:68px;font-family:'Press Start 2P',monospace;font-size:10px;color:#f7e6cc;background:rgba(22,16,38,.55);
  border:0;box-shadow:0 0 0 3px #f0b060;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.down{background:#f0b060;color:#1b1530}
#tFire{right:22px;bottom:96px}#tRoll{right:104px;bottom:40px}#tBurn{left:22px;bottom:40px;height:110px}#tView{right:22px;top:52px;width:58px;height:40px}
#err{position:fixed;inset:auto 0 40% 0;text-align:center;color:#ffd890;font-family:'JetBrains Mono',monospace;display:none;z-index:9}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="title"><div id="card">
  <h1>PATROL</h1>
  <p class="tag mono">LAKE COUNTRY &middot; AUTUMN &middot; LAST LIGHT</p>
  <div id="bar"><i></i></div>
  <p id="status" class="mono">Starting&hellip;</p>
  <button id="go">CLICK TO FLY</button>
  <p class="keys mono"><b>Mouse</b> steer &middot; <b>Click</b> barrel roll &middot; <b>Hold</b> afterburner<br><b>Right click / F</b> missile &middot; <b>Space</b> change view</p>
</div></div>
<div id="hints" class="mono"><span class="mouse"><b>MOUSE</b> steer</span><span class="mouse"><b>CLICK</b> roll</span><span class="mouse"><b>HOLD</b> burner</span><span class="mouse"><b>RMB/F</b> missile</span><span><b>SPACE</b> view <span id="view">CHASE</span></span><span>MSL <span id="msl"></span></span></div>
<button id="snd" class="mono">SOUND OFF</button>
<div id="touch"><button class="tb" id="tFire">FIRE</button><button class="tb" id="tRoll">ROLL</button><button class="tb" id="tBurn">BURN</button><button class="tb" id="tView">VIEW</button></div>
<div id="err"></div>
<script type="text/plain" id="wsrc">
// ---- terrain worker (embedded into patrol.html) ----
const GX = new Float32Array(16), GY = new Float32Array(16);
for (let i = 0; i < 16; i++) { GX[i] = Math.cos(i * Math.PI / 8 + 0.2); GY[i] = Math.sin(i * Math.PI / 8 + 0.2); }
function hsh(x, y, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function noise(x, y, P, s) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const ax = ((x0 % P) + P) % P, ay = ((y0 % P) + P) % P, bx = (ax + 1) % P, by = (ay + 1) % P;
  let h;
  h = hsh(ax, ay, s) & 15; const n00 = GX[h] * fx + GY[h] * fy;
  h = hsh(bx, ay, s) & 15; const n10 = GX[h] * (fx - 1) + GY[h] * fy;
  h = hsh(ax, by, s) & 15; const n01 = GX[h] * fx + GY[h] * (fy - 1);
  h = hsh(bx, by, s) & 15; const n11 = GX[h] * (fx - 1) + GY[h] * (fy - 1);
  return (n00 + (n10 - n00) * u + (n01 - n00) * v + (n00 - n10 - n01 + n11) * u * v) * 1.45;
}
function fbm(u, v, f, oct, s, gain) {
  gain = gain || 0.5; let a = 1, sum = 0, nrm = 0;
  for (let i = 0; i < oct; i++) { sum += a * noise(u * f, v * f, f, s + i * 17); nrm += a; a *= gain; f *= 2; }
  return sum / nrm;
}
function billow(u, v, f, oct, s) {
  let a = 1, sum = 0, nrm = 0;
  for (let i = 0; i < oct; i++) { sum += a * (1 - 2 * Math.abs(noise(u * f, v * f, f, s + i * 29))); nrm += a; a *= 0.5; f *= 2; }
  return sum / nrm;
}
function ridged(u, v, f, oct, s) {
  let a = 1, sum = 0, nrm = 0, w = 1;
  for (let i = 0; i < oct; i++) {
    let n = 1 - Math.abs(noise(u * f, v * f, f, s + i * 31)); n *= n; n *= w; w = Math.min(1, n * 1.8);
    sum += a * n; nrm += a; a *= 0.5; f *= 2;
  }
  return sum / nrm;
}
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function heightAt(u, v, S) {
  const wx = fbm(u, v, 3, 4, S + 11) * 0.09, wy = fbm(u, v, 3, 4, S + 23) * 0.09;
  const uu = u + wx, vv = v + wy;
  const e = fbm(uu, vv, 4, 7, S + 1, 0.52);
  let h = e * 240 + 14;
  const mm = sstep(0.02, 0.32, fbm(u, v, 2, 3, S + 5) + 0.06);
  const r = ridged(uu, vv, 5, 6, S + 7);
  h += mm * (r * r * 780 + 40) * sstep(-25, 30, h);
  if (h < 0) h = Math.max(h * 0.75, -70);
  else if (h < 26) h = h * h / 26;      // gentle beaches
  return h;
}

function cloudAt(u, v, S) {
  return fbm(u, v, 10, 4, S + 101) * 0.8 + fbm(u, v, 3, 2, S + 131) * 0.32 + billow(u, v, 40, 2, S + 151) * 0.1;
}

let HF = null;
function wrapIdx(i, N) { return ((i % N) + N) % N; }

self.onmessage = (ev) => {
  const m = ev.data;
  if (m.t === 'setH') { HF = m.H; return; }
  if (m.t === 'height') {
    const N = m.N, out = new Float32Array((m.j1 - m.j0) * N);
    for (let j = m.j0; j < m.j1; j++) for (let i = 0; i < N; i++) out[(j - m.j0) * N + i] = heightAt(i / N, j / N, m.seed);
    self.postMessage({ t: m.t, j0: m.j0, j1: m.j1, d: out }, [out.buffer]);
  } else if (m.t === 'cloud') {
    const N = m.N, out = new Float32Array(N * N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) out[j * N + i] = cloudAt(i / N, j / N, m.seed);
    self.postMessage({ t: m.t, d: out }, [out.buffer]);
  } else if (m.t === 'mask') {
    // forest density, hue, conifer; also returns height with forest canopy added
    const N = m.N, n = (m.j1 - m.j0) * N, cell = m.tile / N;
    const forest = new Uint8Array(n), hue = new Uint8Array(n), con = new Uint8Array(n), hc = new Float32Array(n);
    for (let j = m.j0; j < m.j1; j++) for (let i = 0; i < N; i++) {
      const k = (j - m.j0) * N + i, h = HF[j * N + i];
      const hx = HF[j * N + wrapIdx(i + 1, N)] - HF[j * N + wrapIdx(i - 1, N)];
      const hz = HF[wrapIdx(j + 1, N) * N + i] - HF[wrapIdx(j - 1, N) * N + i];
      const slope = Math.sqrt(hx * hx + hz * hz) / (2 * cell);
      const u = i / N, v = j / N;
      let f = sstep(-0.06, 0.16, fbm(u, v, 9, 4, m.seed + 41)) * sstep(4, 12, h) * (1 - sstep(0.55, 0.9, slope)) * (1 - sstep(380, 470, h));
      const hu = Math.min(1, Math.max(0, fbm(u, v, 14, 3, m.seed + 53) * 1.6 + 0.5));
      const c = Math.min(1, Math.max(0, sstep(150, 420, h) * 0.85 + fbm(u, v, 20, 2, m.seed + 67) * 0.8 + 0.05)) * (h > 6 ? 1 : 0);
      if (c > 0.5) f = Math.max(f, c * 0.9 * (1 - sstep(0.6, 0.95, slope)) * (1 - sstep(440, 500, h)));
      const tn = noise(u * 420, v * 420, 420, m.seed + 77) * 0.5 + 0.5;
      forest[k] = f * 255; hue[k] = hu * 255; con[k] = c * 255;
      hc[k] = h + (f > 0.3 ? (f - 0.3) / 0.7 * (5 + 7 * tn) : 0);
    }
    self.postMessage({ t: m.t, j0: m.j0, j1: m.j1, forest, hue, con, hc }, [forest.buffer, hue.buffer, con.buffer, hc.buffer]);
  } else if (m.t === 'shadow') {
    const N = m.N, n = (m.j1 - m.j0) * N, cell = m.tile / N, sx = m.sun[0], sz = m.sun[2];
    const len = Math.hypot(sx, sz), dx = sx / len, dz = sz / len, rise = m.sun[1] / len * cell;
    const out = new Uint8Array(n);
    for (let j = m.j0; j < m.j1; j++) for (let i = 0; i < N; i++) {
      const h0 = Math.max(HF[j * N + i], 0) + 0.8;
      let d = 0.7, minc = 1e9;
      for (let s = 0; s < 90 && d < 700; s++) {
        const x = i + dx * d, z = j + dz * d;
        const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi;
        const a = wrapIdx(xi, N), b = wrapIdx(xi + 1, N), c = wrapIdx(zi, N), e = wrapIdx(zi + 1, N);
        const hh = (HF[c * N + a] * (1 - fx) + HF[c * N + b] * fx) * (1 - fz) + (HF[e * N + a] * (1 - fx) + HF[e * N + b] * fx) * fz;
        const clr = (h0 + d * rise - hh) / (1.5 + d * 0.12);
        if (clr < minc) minc = clr;
        if (minc < -1) break;
        d += 0.6 + d * 0.045;
      }
      out[(j - m.j0) * N + i] = Math.max(0, Math.min(1, minc * 0.5 + 0.5)) * 255;
    }
    self.postMessage({ t: m.t, j0: m.j0, j1: m.j1, d: out }, [out.buffer]);
  }
};

</script>
<script>
// ================= SHADERS =================
const GLSL_COMMON = `#version 300 es
precision highp float;
precision highp int;
float bayer(vec2 p){ ivec2 q=ivec2(mod(p,4.)); int i=q.x+q.y*4;
  const float B[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return (B[i]+.5)/16.; }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x),f.y); }
`;

const VS_FULL = `#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.-1.,0.,1.); }`;

const FS_WORLD = GLSL_COMMON + `
uniform sampler2D uH, uM, uC;
uniform mat4 uInvVP, uVP;
uniform vec3 uCamW, uSun;
uniform vec2 uRes, uCloudOff;
uniform float uTime, uThr, uCMax;
uniform vec3 uJP, uJF, uJR, uJU;
uniform vec4 uMk[8];
uniform vec4 uMk2[8];
out vec4 o;
const float TILE=10240., CT=5120., CB=400., CK=120., HMAX=860., TMAX=15000.;
float H(vec2 p){ return texture(uH,p/TILE).r; }
float cov(vec2 p){ return texture(uC,(p+uCloudOff)/CT).r; }
float cloudS(vec2 p){ return clamp((cov(p)-uThr)/(uCMax-uThr),0.,1.); }
float ctop(vec2 p, float s){ float d=texture(uC,(p+uCloudOff*.7)/(CT*.16)).r; float r=sqrt(s); return CB+CK*r*(.78+.7*(d-.2)); }

vec3 sky(vec3 d){
  float e=d.y;
  vec2 dh=normalize(d.xz+vec2(1e-5)), sh=normalize(uSun.xz);
  float az=dot(dh,sh)*.5+.5;
  float sd=dot(d,uSun);
  vec3 hor=mix(vec3(.80,.66,.82), vec3(1.,.76,.45), pow(az,2.2));
  vec3 mid=mix(vec3(.58,.54,.79), vec3(.95,.66,.60), pow(az,3.));
  vec3 zen=vec3(.25,.25,.52);
  float ee=max(e,0.);
  vec3 c=mix(hor,mid,smoothstep(0.,.13,ee));
  c=mix(c,zen,smoothstep(.12,.75,ee));
  c=mix(c,vec3(1.,.88,.6),smoothstep(.965,.997,sd)*.85);
  if(e>.015){
    vec2 uv=d.xz/(e+.06);
    vec2 r=vec2(uv.x*.8+uv.y*.6, -uv.x*.6+uv.y*.8);
    float n=vnoise(vec2(r.x*.7,r.y*16.)+vec2(uTime*.004,0.))*.6+vnoise(vec2(r.x*2.,r.y*40.))*.4;
    float band=smoothstep(.68,.98,vnoise(r*vec2(.22,.4)+3.));
    float s=smoothstep(.66,.72,n)*band*smoothstep(.02,.1,e)*(1.-smoothstep(.25,.5,e));
    vec3 sc=mix(vec3(.93,.74,.82),vec3(1.,.86,.66),pow(az,2.));
    c=mix(c,sc,s*.7);
  }
  if(sd>.99875) c=vec3(1.,.97,.84);
  else if(sd>.9984) c=vec3(1.,.86,.52);
  return c;
}
vec3 fogc(vec3 d){ return sky(normalize(vec3(d.x,0.0005,d.z))); }
float fogAmt(float t,float y){
  float f=1.-exp(-max(t-1400.,0.)*(.00014+.00008*exp(-max(y,0.)/300.)));
  return mix(f,1.,smoothstep(9000.,TMAX,t));
}

bool marchT(vec3 ro, vec3 rd, out float t){
  t=.5;
  if(ro.y>HMAX){ if(rd.y>=0.) return false; t=(ro.y-HMAX)/(-rd.y); }
  float lt=t;
  for(int i=0;i<220;i++){
    if(t>TMAX) return false;
    vec3 p=ro+rd*t;
    float d=p.y-max(H(p.xz),0.);
    if(d<.0015*t){
      float a=lt,b=t;
      for(int k=0;k<6;k++){ float m=(a+b)*.5; vec3 q=ro+rd*m; if(q.y-max(H(q.xz),0.)<0.) b=m; else a=m; }
      t=b; return true;
    }
    if(p.y>HMAX && rd.y>0.) return false;
    lt=t;
    t+=max(d*.42,.4+t*.0032);
  }
  return false;
}

bool marchC(vec3 ro, vec3 rd, float tEnd, out float tc){
  float y0=CB-CK*.23, y1=CB+CK*1.55;
  float ta,tb;
  if(abs(rd.y)<1e-4){ if(ro.y<y0||ro.y>y1) return false; ta=0.; tb=tEnd; }
  else { float t0=(y0-ro.y)/rd.y, t1=(y1-ro.y)/rd.y; ta=max(min(t0,t1),0.); tb=min(max(t0,t1),tEnd); }
  tb=min(tb,ta+11000.);
  if(ta>=tb) return false;
  float t=ta, lt=ta;
  for(int i=0;i<72;i++){
    vec3 p=ro+rd*t;
    float s=cloudS(p.xz);
    float rs=sqrt(s);
    float top=ctop(p.xz,s), bot=CB-CK*.22*rs;
    float d= s<=0. ? max(p.y-CB,10.) : (p.y>top ? p.y-top : (p.y<bot ? bot-p.y : -1.));
    if(d<0.){
      float a=lt,b=t;
      for(int k=0;k<5;k++){ float m=(a+b)*.5; vec3 q=ro+rd*m; float ss=cloudS(q.xz); float r2=sqrt(ss);
        float tp=ctop(q.xz,ss), bt=CB-CK*.22*r2; if(ss>0. && q.y<tp && q.y>bt) b=m; else a=m; }
      tc=b; return true;
    }
    lt=t;
    t+=clamp(d*.7/max(abs(rd.y),.18), 7.+t*.004, 55.+t*.02);
    if(t>tb) return false;
  }
  return false;
}

float jetShadow(vec3 rel){
  float den=dot(uSun,uJU);
  if(abs(den)<.04) return 1.;
  float s=dot(uJP-rel,uJU)/den;
  if(s<0.) return 1.;
  vec3 q=rel+uSun*s-uJP;
  float a=dot(q,uJF), b=abs(dot(q,uJR));
  bool fus = b<.95 && a>-8.3 && a<8.8-b*2.4;
  bool wing = b<5.6 && a>-5.8 && a<2.4-(b-1.3)*1.44;
  bool stab = b<3.6 && a>-7.95 && a< -5.6-(b-1.4)*.65;
  return (fus||wing||stab) ? .42 : 1.;
}
float cloudShadow(vec3 pw){
  vec3 q=pw+uSun*((CB+60.-pw.y)/uSun.y);
  float s=cloudS(q.xz);
  return s>.02 ? .5 : 1.;
}
vec3 shadeTone(vec3 base, float L, float bay){
  float l=L+(bay-.5)*.09;
  vec3 lit=base*vec3(1.13,1.,.84);
  vec3 mid=base*vec3(.86,.78,.80);
  vec3 shd=base*vec3(.44,.40,.62)+vec3(.035,.03,.075);
  return l>.64 ? lit : (l>.24 ? mid : shd);
}
vec3 marks(vec3 col, vec3 rel, bool water, float bay){
  for(int i=0;i<8;i++){
    vec4 m=uMk[i], m2=uMk2[i];
    if(m.z<=0.) continue;
    vec2 dd=rel.xz-m.xy; float d=length(dd);
    if(d>m.z*1.6+40.) continue;
    float nn=vnoise(dd*.09+float(i)*7.3);
    if(m2.x<1.5 && !water){
      float r=m.z*(.7+.5*nn);
      if(d<r){
        float k=d/r;
        vec3 ch=mix(vec3(.10,.08,.10),vec3(.28,.20,.18),k*k);
        col=mix(col,ch,step(bay*.6+.35,m.w*(1.25-k*.5)));
        vec2 ec=floor(dd/2.2);
        float h=hash12(ec+float(i)*13.1);
        float fl=sin(uTime*(3.+h*5.)+h*40.);
        if(h>.93 && fl>.2 && m2.y<40. && k<.85) col=mix(vec3(1.,.42,.12),vec3(1.,.82,.3),step(.7,fl));
      }
    } else if(m2.x>1.5 && water){
      float r=m.z, w=3.+r*.07;
      float ring=abs(d-r*(.92+.12*nn));
      if(ring<w && m.w>bay*.9) col=mix(col,vec3(.96,.97,.95),.9);
      else if(d<r && hash12(floor(dd/3.))>.72 && m.w*.8>bay) col=mix(col,vec3(.9,.96,.95),.75);
    }
  }
  return col;
}

vec3 land(vec3 pw, vec3 rel, vec3 rd, float t, float bay){
  float h=H(pw.xz);

  float hz=H(pw.xz+vec2(0,e))-H(pw.xz-vec2(0,e));

  base=mix(base,vec3(.80,.66,.42),step(.78,nz2)*.6);
  float fth=.42+(bay-.5)*.22;
  if(m.r>fth){
    float hu=m.g+(nz2-.5)*.25;
    vec3 fc= hu<.36 ? vec3(.95,.52,.20) : (hu<.62 ? vec3(.80,.22,.22) : vec3(.96,.74,.26));
    float cell=hash12(floor(pw.xz/7.));
    fc*= cell>.7 ? .82 : 1.;
    float tk=hash12(floor(pw.xz/3.3)+.7); fc*= tk>.84 ? 1.14 : (tk<.16 ? .78 : 1.);
    if(cell<m.a*.95) fc=mix(vec3(.20,.33,.27),vec3(.15,.24,.22),step(.5,hash12(floor(pw.xz/5.)+3.)));
    base=fc;
  }

  if(slope>.40+nz*.12 || (h>430. && slope>.2+nz*.1)) base=mix(vec3(.60,.56,.66),vec3(.45,.42,.53),step(.55,nz2));
  if(h>545.+nz*70. && slope<.62) base=vec3(.98,.96,.95);

vec3 water(vec3 pw, vec3 rel, vec3 rd, float t, float bay){
  float depth=-H(pw.xz);
  float dj=depth+(bay-.5)*1.4;
  vec3 c = dj<1.4 ? vec3(.62,.90,.84) : dj<4.5 ? vec3(.40,.80,.78) : dj<10. ? vec3(.22,.62,.70) : dj<20. ? vec3(.14,.44,.60) : dj<36. ? vec3(.10,.30,.50) : vec3(.08,.19,.38);

  float rp=sin(dot(pw.xz,vec2(.045,.031))+vnoise(pw.xz*.012)*7.+uTime*.9);
  if(dj>3. && rp>.93-vnoise(pw.xz*.04-uTime*.05)*.12) c=c*1.25+.03;

  vec3 r=reflect(rd,nr);

vec3 cloudShade(vec3 pw, vec3 rel, float bay){
  float s=cloudS(pw.xz);
  float e=22.;
  float t0=ctop(pw.xz,s), tx=ctop(pw.xz+vec2(e,0),cloudS(pw.xz+vec2(e,0))), tz=ctop(pw.xz+vec2(0,e),cloudS(pw.xz+vec2(0,e)));

    if (!S.started) { start(); return; } touchSteer.set(e.pointerId, 1); S.mouse = toInternal(e); S.auto = false; });
  c.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' || !touchSteer.has(e.pointerId)) return; e.preventDefault(); S.mouse = toInternal(e); });
  const up = e => { if (e.pointerType !== 'touch') return; touchSteer.delete(e.pointerId); if (!touchSteer.size && S.view !== 0) S.mouse = screenCenter(); };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
}
function tbtn(id, down, up) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!S.started) start(); b.classList.add('down'); down && down(); });
  const u = e => { b.classList.remove('down'); up && up(); };
  b.addEventListener('pointerup', u); b.addEventListener('pointercancel', u); b.addEventListener('pointerleave', u);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
tbtn('tFire', fire); tbtn('tRoll', barrelRoll); tbtn('tBurn', () => S.touchBurn = true, () => S.touchBurn = false); tbtn('tView', () => setView((S.view + 1) % 3));
addEventListener('resize', () => resize());

// ================= LOOP =================
let last = performance.now(), slowT = 0, fastT = 0, ema = 16, warm = 0;
function adapt(ms, dt) {
  warm += dt; if (warm < 2.5) return;
  ema += (ms - ema) * 0.08;
  if (ema > 25) { slowT += dt; fastT = 0; } else if (ema < 13) { fastT += dt; slowT = 0; } else { slowT = Math.max(0, slowT - dt); fastT = 0; }
  if (slowT > 1.2 && S.qLevel < LEVELS.length - 1) { S.qLevel++; slowT = 0; warm = 0; ema = 16; resize(); }
  if (fastT > 6 && S.qLevel > 0) { S.qLevel--; fastT = 0; warm = 0; ema = 16; resize(); }
}
function step(dt) {
  S.t += dt;
  updateFlight(dt);
  updateMissiles(dt);
  updateParts(dt);
  updateFx(dt);
  updateCamera(dt);
  Cockpit.updateRadar(dt);
  Snd.update(dt);
}
function draw() {
  render();
  const ctx = ovc.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, W, H);
  const pres = S.cam.cockpit;
  if (pres > 0.01) { const top = Cockpit.draw(ctx, pres); if (pres > 0.97) drawHUD(ctx, top); }
  drawReticle(ctx);
}
function frame(now) {
  const ms = now - last; last = now;
  const dt = Math.min(0.05, Math.max(0, ms / 1000));
  if (WORLD.ready && !window.__patrolManual) { step(dt); draw(); adapt(ms, dt); }
  requestAnimationFrame(frame);
}
// test & debug hook
window.__patrol = { S, ERR, step, draw, setView, fire, barrelRoll, start, explode, hAt, resize, get W() { return W; }, get H() { return H; } };

if (gl) {
  resize(); updateMslUI();
  const bar = $('bar').firstElementChild, st = $('status');
  st.textContent = 'Generating terrain 0%';
  genWorld(p => { bar.style.width = (p * 100).toFixed(1) + '%'; st.textContent = (p < 0.36 ? 'Raising hills ' : p < 0.7 ? 'Planting autumn forests ' : p < 0.98 ? 'Baking long shadows ' : 'Gathering clouds ') + Math.round(p * 100) + '%'; })
    .then(d => {
      uploadWorld(d);
      // start over lake country away from the high peaks
      let best = null;
      for (let j = 0; j < 64; j++) for (let i = 0; i < 64; i++) {
        const x = (i + .5) / 64 * TILE, z = (j + .5) / 64 * TILE; if (hAt(x, z) > -8) continue;
        let mx = 0, w = 0; for (let a = 0; a < 16; a++) { const r = 400 + (a % 4) * 500, an = a * 2.4; const h = hAt(x + Math.cos(an) * r, z + Math.sin(an) * r); mx = Math.max(mx, h); if (h < 0) w++; }
        const sc = mx + Math.abs(w - 6) * 30; if (!best || sc < best[0]) best = [sc, x, z];
      }
      if (best) { S.pos[0] = best[1]; S.pos[2] = best[2]; }
      st.textContent = 'Ready'; bar.style.width = '100%'; $('go').classList.add('ready');
      updateCamera(0); last = performance.now(); requestAnimationFrame(frame);
    })
    .catch(e => fatal('World generation failed: ' + e));
}

</script>
