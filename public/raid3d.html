<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Căn cứ tận thế 3D · Fungame</title>
  <link rel="stylesheet" href="raid3d.css" />
