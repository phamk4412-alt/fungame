<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lá Chắn Ngôn Từ · Video</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="video.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03050c; color: #eef1ff; font-family: "Segoe UI", "Be Vietnam Pro", Roboto, Arial, sans-serif; }
    #screen { position: fixed; inset: 0; }
    #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(3,5,12,.93); z-index: 5; }
    #ui.hide { display: none; }
    #playBtn { font: inherit; font-size: 30px; font-weight: 800; padding: 22px 54px; border: 0; border-radius: 60px; color: #fff; cursor: pointer; background: linear-gradient(90deg, #ff4d8d, #a77bff); box-shadow: 0 10px 40px rgba(255,77,141,.4); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .row a { color: #c9d0f2; text-decoration: none; padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,.2); }
    .row a.on { border-color: #ff8fbd; color: #fff; }
    #ui small { color: #9aa3c7; }
    body.rec #ui, body.rec .progress { display: none !important; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="ui">
    <button id="playBtn">▶ Phát video</button>
    <div class="row" id="pick"></div>
    <div class="row"><a href="index.html">⌂ Chơi trên máy chiếu</a><a href="arena.html">👥 Mở Đấu Trường</a></div>
    <small>Phím: Space tạm dừng · ← → tua 5 giây · M tắt tiếng · F toàn màn hình</small>
  </div>
  <script src="data.js"></script>
  <script src="avatar.js"></script>
  <script src="video.js"></script>
  <script>
  // Trang xem riêng từng video: intro.html (mở đầu), intro.html?v=r1 | r2 | r3 (video trước mỗi màn).
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const id = LCVideo.ids.includes(q.get('v')) ? q.get('v') : 'intro';
    const T = LCVideo.THEMES;
    const NAMES = { intro: '🎬 Mở đầu', r1: `${T[1].icon} Màn 1`, r2: `${T[2].icon} Màn 2`, r3: `${T[3].icon} Màn 3` };
    $('pick').innerHTML = LCVideo.ids.map((k) => `<a href="?v=${k}" class="${k === id ? 'on' : ''}">${NAMES[k]}</a>`).join('');
    $('playBtn').textContent = '▶ Phát video ' + (id === 'intro' ? 'mở đầu' : NAMES[id].slice(NAMES[id].indexOf(' ') + 1) + ' · ' + T[id[1]].name);
    const v = LCVideo.create($('screen'), id, {
      onEnd() {
        // Xem hết video mở đầu thì vào thẳng Đấu Trường (cùng tab: MC quay lại đúng phòng cũ)
        if (id === 'intro') { $('playBtn').textContent = '👥 Đang vào Đấu Trường…'; $('ui').classList.remove('hide'); setTimeout(() => { location.href = 'arena.html'; }, 1200); }
        else { $('playBtn').textContent = '↺ Xem lại'; $('ui').classList.remove('hide'); }
      },
    });
    v.seek(2.6);
    let muted = false;
    const play = () => { $('ui').classList.add('hide'); if (v.time >= v.duration - 0.01 || v.time === 2.6) v.seek(0); v.play(); };
    $('playBtn').onclick = play;
    $('screen').onclick = () => (v.playing ? v.pause() : play());
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); if (v.playing) v.pause(); else { $('ui').classList.add('hide'); v.play(); } }
      else if (e.key === 'ArrowRight') v.seek(v.time + 5);
      else if (e.key === 'ArrowLeft') v.seek(v.time - 5);
      else if (e.key === 'm' || e.key === 'M') { muted = !muted; v.setMuted(muted); }
      else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
    });
    // Móc cho công cụ ghi MP4 (tools/lachan-intro-video.js)
    window.__intro = {
      duration: v.duration,
      seek(s) { document.body.classList.add('rec'); v.pause(); v.seek(s); },
      renderAudio: () => v.renderAudio(),
    };
  })();
  </script>
</body>
</html>
